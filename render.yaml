services:
  - type: web
    name: clauseiq
    env: python
    buildCommand: cd backend/clauseiq && pip install -r requirements.txt
    startCommand: cd backend/clauseiq && python -m uvicorn clauseiq.api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PYTHON_VERSION # Explicitly setting Python version via environment variable
        value: "3.9.18"
